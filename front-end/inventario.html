<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ... head igual ao catalogo ... -->
    <meta charset="UTF-8">
    <title>Inventário - Quatro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/inventario.js" defer></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-logo">第四組項目</a>
        <div class="nav-links">
            <a href="perfil.html">PERFIL</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="inventario.html" class="active">INVENTÁRIO</a>
            <a href="mercado.html">MERCADO</a>
            <a href="usuarios.html" id="navAdminUsuarios" style="display: none;">USUÁRIOS</a>
        </div>
    </nav>

    <div class="page-header">
        <div class="page-title">Inventário</div>
        <div class="wallet-container">
            <span class="wallet-label">CARTEIRA:</span>
            <div class="wallet-pill" id="walletBalance">0.00</div>
        </div>
    </div>

    <div class="card-grid" id="inventoryGrid"></div>

    <div class="modal-overlay" id="cardModal">
        <div class="modal-content-wrapper">
            <span class="modal-close" id="closeModal">X</span>
            <div class="modal-card-preview" id="modalCardPreview">
                <button class="btn-action" id="btnVender">VENDER</button>
            </div>
            <div class="modal-details">
                <h3 id="modalCardName">Nome da Carta</h3>
                <div class="modal-desc-box" id="modalCardDesc">Desc...</div>
                <div class="modal-stats">
                    PODER: <span id="modalCardPower">0</span><br>
                    TIPO: <span id="modalCardType">Desc</span><br>
                    RARIDADE: <span id="modalCardRarity">Basica</span><br>
                    QUANTIDADE: <span id="modalCardQty">0</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
