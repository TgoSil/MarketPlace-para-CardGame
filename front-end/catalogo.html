<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Quatro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/catalogo.js" defer></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-logo">第四組項目</a>
        <div class="nav-links">
            <a href="perfil.html">PERFIL</a>
            <a href="catalogo.html" class="active">CATÁLOGO</a>
            <a href="inventario.html">INVENTÁRIO</a>
            <a href="mercado.html">MERCADO</a>
            <a href="usuarios.html" id="navAdminUsuarios" style="display: none;">USUÁRIOS</a>
        </div>
    </nav>

    <div class="page-header">
        <div class="page-title">
            Catálogo
            <button id="btnNovaCarta" style="display: none; margin-left: 10px; cursor: pointer;">+</button>
        </div>
        <div class="wallet-container">
            <span class="wallet-label">CARTEIRA:</span>
            <div class="wallet-pill" id="walletBalance">0.00</div>
        </div>
    </div>

    <!-- Modal para Adicionar Carta -->
    <div id="modalAdmin" class="modal" style="display:none; position:fixed; top:20%; left:30%; width:40%; background:white; padding:20px; border:2px solid #000; z-index:1000;">
        <h3>Adicionar Nova Carta</h3>
        <input type="text" id="adminNome" placeholder="Nome" style="width:100%; margin-bottom:5px;">
        <input type="text" id="adminTipo" placeholder="Tipo" style="width:100%; margin-bottom:5px;">
        <input type="number" id="adminVida" placeholder="Vida" style="width:100%; margin-bottom:5px;">
        <input type="text" id="adminRaridade" placeholder="Raridade" style="width:100%; margin-bottom:5px;">
        <input type="text" id="adminUrl" placeholder="Imagem URL" style="width:100%; margin-bottom:10px;">
        <button id="btnSalvarCarta">Salvar Carta</button>
        <button onclick="document.getElementById('modalAdmin').style.display='none'">Cancelar</button>
    </div>

    <!-- Grid onde as cartas serão injetadas -->
    <div class="card-grid" id="catalogGrid"></div>

    <!-- Modal de Detalhes -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-content-wrapper">
            <span class="modal-close" id="closeModal">X</span>
            
            <div class="modal-card-preview" id="modalCardPreview">
                <!-- A carta clonada virá para cá -->
                <button class="btn-action" id="btnComprar">COMPRAR</button>
            </div>
            
            <div class="modal-details">
                <h3 id="modalCardName">Nome da Carta</h3>
                <div class="modal-desc-box" id="modalCardDesc">
                    Descrição da carta...
                </div>
                <div class="modal-stats">
                    PODER: <span id="modalCardPower">0</span><br>
                    TIPO: <span id="modalCardType">Desconhecido</span><br>
                    RARIDADE: <span id="modalCardRarity">Básica</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
