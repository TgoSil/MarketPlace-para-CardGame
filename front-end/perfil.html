<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Quatro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/perfil.js" defer></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-logo">第四組項目</a>
        <div class="nav-links">
            <a href="perfil.html" class="active">PERFIL</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="inventario.html">INVENTÁRIO</a>
            <a href="mercado.html">MERCADO</a>
            <a href="usuarios.html" id="navAdminUsuarios" style="display: none;">USUÁRIOS</a>
        </div>
    </nav>

    <main>
        <div class="profile-card">
            <h2 class="profile-title">CARREGANDO...</h2>
            <div class="profile-info-row">
                <span>CRIADO EM:</span>
                <div id="criadoEm" class="profile-input-mock">--/--/----</div>
            </div>

            <div class="profile-info-row"><span>SUAS OFERTAS ATIVAS:</span></div>
            <div class="offers-list" id="offersList">
                <p>Carregando ofertas...</p>
            </div>

            <div class="reward-section" id="rewardSection">
                <h3 class="reward-title">RECOMPENSA DIÁRIA (CICLO <span id="rewardCiclo">-</span> - DIA <span id="rewardDia">-</span>)</h3>
                <p id="rewardInfo" class="reward-text">VERIFICANDO...</p>
                <button id="btnResgatar" class="btn-reward" style="display: none;">RESGATAR</button>
            </div>

            <div class="wallet-container">
                <span class="wallet-label">CARTEIRA:</span>
                <div class="wallet-pill" id="walletBalance">0.00</div>
            </div>
        </div>
    </main>
</body>
</html>
