<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento - Quatro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/usuarios.js" defer></script>
    <script src="js/auth.js"></script>
</head>
<body>
    
    <nav class="navbar">
        <a href="#" class="nav-logo">第四組項目</a>
        <div class="nav-links">
            <a href="perfil.html">PERFIL</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="inventario.html">INVENTÁRIO</a>
            <a href="mercado.html">MERCADO</a>
            <a href="usuarios.html" id="navAdminUsuarios" class="active">USUÁRIOS</a>
        </div>
    </nav>

    <div class="page-header">
        <div class="page-title">Gerenciamento de Usuários</div>
    </div>

    <main>
        <!-- Lista de Usuários -->
        <div class="market-container">
            <div class="market-table-container">
                <!-- Ajustamos as colunas para caber botões e IDs -->
                <div class="market-header" style="grid-template-columns: 2fr 1fr 1fr 1fr 1fr;">
                    <span>ID do Usuário</span>
                    <span>Username</span>
                    <span>Carteira</span>
                    <span style="text-align: center;">Dinheiro</span>
                    <span style="text-align: center;">Carta</span>
                </div>
                <div id="usersListBody" class="market-body">
                    <div class="market-row"><span colspan="5" style="text-align: center; width: 100%;">Carregando usuários...</span></div>
                </div>
            </div>
        </div>

        <!-- Modal: Adicionar Dinheiro -->
        <div id="modalDinheiro" class="nova-oferta-container" style="display:none; position:fixed; top:20%; left:50%; transform:translate(-50%, 0); z-index:1000; width: 400px;">
            <h3 class="nova-oferta-title">Adicionar Dinheiro</h3>
            <p id="dinheiroUserName" style="font-weight: bold; margin-bottom: 15px;"></p>
            <div class="form-row">
                <label>Valor:</label>
                <input type="number" id="valorDinheiro" class="market-input" step="0.01" placeholder="Ex: 50.00">
            </div>
            <div class="nova-oferta-actions">
                <button id="btnSalvarDinheiro" class="btn-action">Adicionar</button>
                <button onclick="fecharModais()" class="btn-text-only">Cancelar</button>
            </div>
        </div>

        <!-- Modal: Adicionar Carta -->
        <div id="modalCarta" class="nova-oferta-container" style="display:none; position:fixed; top:20%; left:50%; transform:translate(-50%, 0); z-index:1000; width: 400px;">
            <h3 class="nova-oferta-title">Dar Carta</h3>
            <p id="cartaUserName" style="font-weight: bold; margin-bottom: 15px;"></p>
            <div class="form-row">
                <label>ID da Carta:</label>
                <input type="text" id="idCartaAdd" class="market-input" placeholder="UUID da Carta">
            </div>
            <div class="nova-oferta-actions">
                <button id="btnSalvarCartaUser" class="btn-action">Conceder</button>
                <button onclick="fecharModais()" class="btn-text-only">Cancelar</button>
            </div>
        </div>
    </main>

</body>
</html>
