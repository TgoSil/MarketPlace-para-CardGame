syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.quatro.grpc.inventory";

service InventoryService{
  rpc transfereCarta (TransfereCartaRequest) returns (TransfereCartaResponse);
  rpc validaPosseCarta (ValidaPosseRequest) returns (ValidaPosseResponse);
}

message TransfereCartaRequest {
  string id_carta = 1;
  string id_user1 = 2; // Vendedor
  string id_user2 = 3; // Comprador
  int32 quantidade = 4;
}

message TransfereCartaResponse {
  bool sucesso = 1;
  string mensagem = 2;
}

message ValidaPosseRequest {
  string id_user = 1;
  string id_carta = 2;
}

message ValidaPosseResponse {
  bool possui_carta = 1;
}