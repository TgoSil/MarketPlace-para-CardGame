spring.application.name=order-service

server.port=4008

# gRPC Servers
grpc.client.inventoryService.address=static://inventory-service:9090
grpc.client.inventoryService.negotiation-type=plaintext

grpc.client.profileService.address=static://profile-service:9091
grpc.client.profileService.negotiation-type=plaintext

# MongoDB
spring.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME:rootuser}:${MONGO_INITDB_ROOT_PASSWORD:rootpass}@order-service-db:27017/order_db?authSource=admin&uuidRepresentation=standard

# Kafka Producer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Scheduling
spring.task.scheduling.pool.size=2
