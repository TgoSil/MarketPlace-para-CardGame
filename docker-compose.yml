services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      REWARDS_SERVICE_URL: ${REWARDS_SERVICE_URL}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4004:4004"
    networks:
      - rede-interna

  # ==========================================
  # --- AUTH SERVICE DB ---
  # ==========================================
  auth-service-db-primary:
    image: bitnamilegacy/postgresql:15.8.0-debian-12-r3
    container_name: auth-service-db-primary
    restart: always
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=db
    volumes:
      - ./db_volumes/auth-db-primary:/bitnami/postgresql
    networks:
      - rede-interna

  auth-service-db-replica:
    image: bitnamilegacy/postgresql:15.8.0-debian-12-r3
    container_name: auth-service-db-replica
    restart: always
    depends_on:
      - auth-service-db-primary
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=auth-service-db-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./db_volumes/auth-db-replica:/bitnami/postgresql
    networks:
      - rede-interna


  auth-pgpool:
    image: bitnamilegacy/pgpool:4.6.3-debian-12-r0
    container_name: auth-pgpool
    restart: always
    depends_on:
      - auth-service-db-primary
      - auth-service-db-replica
    entrypoint: ["bash", "/opt/bitnami/pgpool/scripts/entrypoint-wrapper.sh"]
    environment:
      - PGPOOL_BACKEND_NODES=0:auth-service-db-primary:5432,1:auth-service-db-replica:5432
      - PGPOOL_SR_CHECK_USER=${POSTGRES_USER}
      - PGPOOL_SR_CHECK_PASSWORD=${POSTGRES_PASSWORD}
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_POSTGRES_USERNAME=${POSTGRES_USER}
      - PGPOOL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=adminpassword
      # --- Health check e failover automatico do primary ---
      - PGPOOL_SR_CHECK_PERIOD=5
      - PGPOOL_HEALTH_CHECK_PERIOD=5
      - PGPOOL_HEALTH_CHECK_TIMEOUT=10
      - PGPOOL_HEALTH_CHECK_MAX_RETRIES=3
      - PGPOOL_HEALTH_CHECK_RETRY_DELAY=1
      - PGPOOL_FAILOVER_ON_BACKEND_ERROR=yes
    ports:
      - "5001:5432"
    volumes:
      - ./failover/failover.sh:/opt/bitnami/pgpool/scripts/failover.sh
      - ./failover/entrypoint-wrapper.sh:/opt/bitnami/pgpool/scripts/entrypoint-wrapper.sh
      - ./failover/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rede-interna

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - auth-pgpool
      - kafka
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "4001:4001"
    networks:
      - rede-interna

  # ==========================================
  # --- ORDER SERVICE DB (MONGO) ---
  # ==========================================
  order-service-db:
    image: mongo
    container_name: order-service-db
    restart: always
    ports:
      - "27000:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./db_volumes/order-service-db:/data/db
    networks:
      - rede-interna

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=senhaDescartavel
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@order-service-db:27017/
    depends_on:
      - order-service-db
    networks:
      - rede-interna

  # ==========================================
  # --- INVENTORY SERVICE DB ---
