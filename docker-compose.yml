services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - rede-interna

  api-gateway:
    build: ./api-gateway
    restart: always
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      REWARDS_SERVICE_URL: ${REWARDS_SERVICE_URL}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      SETTLEMENT_SERVICE_URL: ${SETTLEMENT_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}

    networks:
    - rede-interna
  auth-service-db-primary:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: auth-service-db-primary
    restart: always
    environment:
    - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
    - POSTGRESQL_USERNAME=${POSTGRES_USER}
    - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRESQL_DATABASE=db
    - REPMGR_PASSWORD=repmgrpassword
    - REPMGR_PRIMARY_HOST=auth-service-db-primary
    - REPMGR_PARTNER_NODES=auth-service-db-primary,auth-service-db-replica
    - REPMGR_NODE_NAME=auth-node-1
    - REPMGR_NODE_NETWORK_NAME=auth-service-db-primary
    - REPMGR_NODE_ID=1
    volumes:
    - auth-db-primary:/bitnami/postgresql
    networks:
    - rede-interna
  auth-service-db-replica:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: auth-service-db-replica
    restart: always
    depends_on:
    - auth-service-db-primary
    environment:
    - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
    - POSTGRESQL_USERNAME=${POSTGRES_USER}
    - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRESQL_DATABASE=db
    - REPMGR_PASSWORD=repmgrpassword
    - REPMGR_PRIMARY_HOST=auth-service-db-primary
    - REPMGR_PARTNER_NODES=auth-service-db-primary,auth-service-db-replica
    - REPMGR_NODE_NAME=auth-node-2
    - REPMGR_NODE_NETWORK_NAME=auth-service-db-replica
    - REPMGR_NODE_ID=2
    volumes:
    - auth-db-replica:/bitnami/postgresql
    networks:
    - rede-interna
  auth-pgpool:
    image: bitnamilegacy/pgpool:4.6.3-debian-12-r0
    container_name: auth-pgpool
    restart: always
    depends_on:
    - auth-service-db-primary
    - auth-service-db-replica
    environment:
    - PGPOOL_BACKEND_NODES=0:auth-service-db-primary:5432,1:auth-service-db-replica:5432
    - PGPOOL_SR_CHECK_USER=${POSTGRES_USER}
    - PGPOOL_SR_CHECK_PASSWORD=${POSTGRES_PASSWORD}
    - PGPOOL_ENABLE_LOAD_BALANCING=yes
    - PGPOOL_POSTGRES_USERNAME=${POSTGRES_USER}
    - PGPOOL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - PGPOOL_ADMIN_USERNAME=admin
    - PGPOOL_ADMIN_PASSWORD=adminpassword
    - PGPOOL_SR_CHECK_PERIOD=5
    - PGPOOL_HEALTH_CHECK_PERIOD=5
    - PGPOOL_HEALTH_CHECK_TIMEOUT=10
    - PGPOOL_HEALTH_CHECK_MAX_RETRIES=3
    - PGPOOL_HEALTH_CHECK_RETRY_DELAY=1
    - PGPOOL_FAILOVER_ON_BACKEND_ERROR=yes
    ports:
    - 5001:5432
    networks:
    - rede-interna
  auth-service:
    build: ./auth-service
    restart: always
    depends_on:
    - auth-pgpool
    - kafka
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
    - rede-interna
  order-service-db:
    image: mongo
    container_name: order-service-db
    restart: always
    ports:
    - 27000:27017
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
    - order-service-db:/data/db
    networks:
    - rede-interna
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
    - 8081:8081
    environment:
    - ME_CONFIG_BASICAUTH_USERNAME=user
    - ME_CONFIG_BASICAUTH_PASSWORD=senhaDescartavel
    - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@order-service-db:27017/
    depends_on:
    - order-service-db
    networks:
    - rede-interna
  inventory-service-db-primary:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: inventory-service-db-primary
    restart: always
    environment:
    - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
    - POSTGRESQL_USERNAME=${POSTGRES_USER}
    - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRESQL_DATABASE=inventory_db
    - REPMGR_PASSWORD=repmgrpassword
    - REPMGR_PRIMARY_HOST=inventory-service-db-primary
    - REPMGR_PARTNER_NODES=inventory-service-db-primary,inventory-service-db-replica
    - REPMGR_NODE_NAME=inventory-node-1
    - REPMGR_NODE_NETWORK_NAME=inventory-service-db-primary
    - REPMGR_NODE_ID=1
