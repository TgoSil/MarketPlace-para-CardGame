      SPRING_DATASOURCE_URL: ${PROFILE_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_SERVER_PORT: 9091
    networks:
    - rede-interna
  catalog-service-db-primary:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: catalog-service-db-primary
    restart: always
    environment:
    - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
    - POSTGRESQL_USERNAME=${POSTGRES_USER}
    - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRESQL_DATABASE=catalog_db
    - REPMGR_PASSWORD=repmgrpassword
    - REPMGR_PRIMARY_HOST=catalog-service-db-primary
    - REPMGR_PARTNER_NODES=catalog-service-db-primary,catalog-service-db-replica
    - REPMGR_NODE_NAME=catalog-node-1
    - REPMGR_NODE_NETWORK_NAME=catalog-service-db-primary
    - REPMGR_NODE_ID=1
    volumes:
    - catalog-db-primary:/bitnami/postgresql
    networks:
    - rede-interna
