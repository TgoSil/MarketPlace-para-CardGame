    - REPMGR_PARTNER_NODES=profile-service-db-primary,profile-service-db-replica
    - REPMGR_NODE_NAME=profile-node-1
    - REPMGR_NODE_NETWORK_NAME=profile-service-db-primary
    - REPMGR_NODE_ID=1
