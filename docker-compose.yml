    - catalog-pgpool
    - kafka
    environment:
      SPRING_DATASOURCE_URL: ${CATALOG_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - rede-interna

  settlement-service-db:
    image: postgres:18
    container_name: settlement-service-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: settlement_db
    ports:
      - "5004:5432"
    networks:
      - rede-interna

  settlement-service:
    build: ./settlement-service
    restart: always
    depends_on:
      - settlement-service-db
      - kafka
    environment:
      SPRING_DATASOURCE_URL: ${SETTLEMENT_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - rede-interna

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
    - "6379:6379"
    networks:
      - rede-interna

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - rede-interna

  matching-service:
    build: ./matching-service
    restart: always
    depends_on:
      - redis
      - kafka
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - rede-interna
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
    - rede-interna
    

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
    - rede-interna
  kafka-ui:
    image: kafbat/kafka-ui:aa21129
    ports:
      - "8080:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    networks:
      - rede-interna

networks:
  rede-interna:
    driver: bridge
volumes:
  auth-db-primary: null
  auth-db-replica: null
  order-service-db: null
  inventory-db-primary: null
  inventory-db-replica: null
  rewards-db-primary: null
  rewards-db-replica: null
  profile-db-primary: null
  profile-db-replica: null
  catalog-db-primary: null
  catalog-db-replica: null
