    - profile-service-db-primary
    environment:
    - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
    - POSTGRESQL_USERNAME=${POSTGRES_USER}
    - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRESQL_DATABASE=profile_db
    - REPMGR_PASSWORD=repmgrpassword
    - REPMGR_PRIMARY_HOST=profile-service-db-primary
    - REPMGR_PARTNER_NODES=profile-service-db-primary,profile-service-db-replica
    - REPMGR_NODE_NAME=profile-node-2
    - REPMGR_NODE_NETWORK_NAME=profile-service-db-replica
    - REPMGR_NODE_ID=2
    volumes:
    - profile-db-replica:/bitnami/postgresql
    networks:
    - rede-interna
  profile-pgpool:
    image: bitnamilegacy/pgpool:4.6.3-debian-12-r0
    container_name: profile-pgpool
    restart: always
    depends_on:
    - profile-service-db-primary
    - profile-service-db-replica
    environment:
    - PGPOOL_BACKEND_NODES=0:profile-service-db-primary:5432,1:profile-service-db-replica:5432
    - PGPOOL_SR_CHECK_USER=${POSTGRES_USER}
    - PGPOOL_SR_CHECK_PASSWORD=${POSTGRES_PASSWORD}
    - PGPOOL_ENABLE_LOAD_BALANCING=yes
    - PGPOOL_POSTGRES_USERNAME=${POSTGRES_USER}
    - PGPOOL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
