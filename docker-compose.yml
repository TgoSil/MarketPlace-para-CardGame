    image: bitnamilegacy/postgresql:15.8.0-debian-12-r3
    container_name: catalog-service-db-primary
    restart: always
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=${POSTGRES_USER} 
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=catalog_db
    volumes:
      - ./db_volumes/catalog-db-primary:/bitnami/postgresql
    networks: 
      - rede-interna

  catalog-service-db-replica:
    image: bitnamilegacy/postgresql:15.8.0-debian-12-r3
    container_name: catalog-service-db-replica
    restart: always
    depends_on:
      - catalog-service-db-primary
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=catalog-service-db-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER} 
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./db_volumes/catalog-db-replica:/bitnami/postgresql
    networks: 
      - rede-interna

  catalog-pgpool:
    image: bitnamilegacy/pgpool:4.6.3-debian-12-r0
    container_name: catalog-pgpool
    restart: always
    depends_on:
      - catalog-service-db-primary
      - catalog-service-db-replica
    entrypoint: ["bash", "/opt/bitnami/pgpool/scripts/entrypoint-wrapper.sh"]
    environment:
      - PGPOOL_BACKEND_NODES=0:catalog-service-db-primary:5432,1:catalog-service-db-replica:5432
      - PGPOOL_SR_CHECK_USER=${POSTGRES_USER}
      - PGPOOL_SR_CHECK_PASSWORD=${POSTGRES_PASSWORD}
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_POSTGRES_USERNAME=${POSTGRES_USER}
      - PGPOOL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=adminpassword
      # --- Health check e failover automatico do primary ---
      - PGPOOL_SR_CHECK_PERIOD=5
      - PGPOOL_HEALTH_CHECK_PERIOD=5
      - PGPOOL_HEALTH_CHECK_TIMEOUT=10
      - PGPOOL_HEALTH_CHECK_MAX_RETRIES=3
      - PGPOOL_HEALTH_CHECK_RETRY_DELAY=1
      - PGPOOL_FAILOVER_ON_BACKEND_ERROR=yes
    ports:
      - "5003:5432"
    volumes:
