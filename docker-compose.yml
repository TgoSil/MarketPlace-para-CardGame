services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      REWARDS_SERVICE_URL: ${REWARDS_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4004:4004"
    networks:
      - rede-interna

  auth-service-db:
    image: postgres:18
    container_name: auth-service-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    volumes:
      - ./db_volumes/auth-service-db:/var/lib/postgresql
    ports:
      - "5001:5432"
    networks:
      - rede-interna

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - auth-service-db
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "4001:4001"
    networks:
      - rede-interna

  order-service-db:
    image: mongo
    container_name: order-service-db
    restart: always
    ports:
      - "27000:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./db_volumes/order-service-db:/data/db
    networks:
      - rede-interna

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=senhaDescartavel
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@order-service-db:27017/
    depends_on:
      - order-service-db
  inventory-service-db:
    image: postgres:18
    container_name: inventory-service-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    networks:
      - rede-interna

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: always
    depends_on:
      - inventory-service-db
    environment:
      SPRING_DATASOURCE_URL: ${INVENTORY_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "4002:4002"
    networks:
      - rede-interna

  rewards-service-db:
    image: postgres:18
    container_name: rewards-service-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    networks:
      - rede-interna

  rewards-service:
    build: ./rewards-service
    container_name: rewards-service
    restart: always
    depends_on:
      - rewards-service-db
      - kafka
    environment:
      SPRING_DATASOURCE_URL: ${REWARDS_SERVICE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "4003:4003"
    networks:
      - rede-interna

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rede-interna

  kafka-ui:
    image: kafbat/kafka-ui:aa21129
    ports:
      -  "8080:8080"
    environment:
      -  DYNAMIC_CONFIG_ENABLED=true
    networks:
      -  rede-interna

networks:
  rede-interna:
    driver: bridge